[project]
name = "brickmatch-ai"
version = "0.1.0"
description = "Local-first multimodal LEGO recommendations"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy<3", "pandas<3", "pillow", "httpx", "scikit-learn", "fastapi", "uvicorn", "pyarrow", "pyyaml", "joblib", "psycopg[binary]"]

[project.optional-dependencies]
legacy = ["streamlit"]
vision = ["torch", "transformers<5"]
search = ["faiss-cpu"]
tracking = ["mlflow"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
